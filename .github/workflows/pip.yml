name: pip

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 0 * * 6"
  workflow_dispatch:

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install latest pip and build
        run: python -m pip install -U pip build

      - name: Build wheel
        run: python -m build --wheel

      - name: pip install wheel with [all] extra
        run: |
          WHEEL=$(echo dist/*.whl)
          python -m pip install "${WHEEL}[all]"

      - name: Verify extras resolved
        run: python -c "import pytest, ruff, sphinx; import self_referential_extras"
