name: hatch

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "self_referential_extras/**"
      - "pyproject.toml"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "self_referential_extras/**"
      - "pyproject.toml"
  schedule:
    - cron: "0 0 * * 6"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5

      - name: Install latest pip, build, and hatch
        run: python -m pip install -U pip build hatch

      - name: Build wheel
        run: python -m build --wheel

      - name: Declare dependency then hatch dep sync
        run: |
          WHEEL=$(echo "$GITHUB_WORKSPACE"/dist/*.whl)
          mkdir -p /tmp/hatch-sync-test
          cd /tmp/hatch-sync-test
          cat > pyproject.toml <<EOF
          [project]
          name = "hatch-sync-test"
          version = "0.1.0"
          requires-python = ">=3.12"
          dependencies = []

          [build-system]
          requires = ["hatchling"]
          build-backend = "hatchling.build"

          [tool.hatch.metadata]
          allow-direct-references = true

          [tool.hatch.envs.default]
          skip-install = true
          dependencies = [
            "self-referential-extras[all] @ file://${WHEEL}"
          ]
          locked = true
          installer = "uv"
          locker = "uv"
          EOF
          hatch env lock
          hatch dep sync

      - name: Verify extras resolved
        working-directory: /tmp/hatch-sync-test
        run: hatch run python -c "import pytest, ruff, sphinx; import self_referential_extras"
