name: pdm

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 0 * * 6"
  workflow_dispatch:

jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install latest pip, build, and pdm
        run: python -m pip install -U pip build pdm

      - name: Build wheel
        run: python -m build --wheel

      - name: pdm add wheel with [all] extra
        run: |
          WHEEL=$(echo "$GITHUB_WORKSPACE"/dist/*.whl)
          mkdir -p /tmp/pdm-add-test
          cd /tmp/pdm-add-test
          pdm init --non-interactive --python 3.12
          pdm add "${WHEEL}[all]"

      - name: Verify extras resolved
        working-directory: /tmp/pdm-add-test
        run: pdm run python -c "import pytest, ruff, sphinx; import self_referential_extras"

  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install latest pip, build, and pdm
        run: python -m pip install -U pip build pdm

      - name: Build wheel
        run: python -m build --wheel

      - name: Declare dependency then pdm sync
        run: |
          WHEEL=$(echo "$GITHUB_WORKSPACE"/dist/*.whl)
          mkdir -p /tmp/pdm-sync-test
          cd /tmp/pdm-sync-test
          cat > pyproject.toml <<EOF
          [project]
          name = "pdm-sync-test"
          version = "0.1.0"
          requires-python = ">=3.12"
          dependencies = [
            "self-referential-extras[all] @ file://${WHEEL}"
          ]

          [tool.pdm]
          distribution = false
          EOF
          pdm lock
          pdm sync

      - name: Verify extras resolved
        working-directory: /tmp/pdm-sync-test
        run: pdm run python -c "import pytest, ruff, sphinx; import self_referential_extras"
